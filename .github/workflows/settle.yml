name: Quick settle

# Settles finished bets, £1K steps and the Accabox bot's accas without rebuilding the site.
# Started every few minutes by cron-job.org ("Accabox quick settle"); the full update (update.yml) still runs every 15 minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Latest published data
        run: curl -sf "https://snuzzyyy.github.io/matchday-edge/data.json" -o site/data.json || true
      - name: Settle finished bets, £1K steps and bot accas
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 engine/settle.py || true
