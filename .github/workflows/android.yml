name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MatchdayEdge.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "Matchday Edge for Android" --notes "Download MatchdayEdge.apk on your phone and open it to install. The app loads the live site, so it updates itself."
          gh release upload app MatchdayEdge.apk --clobber
