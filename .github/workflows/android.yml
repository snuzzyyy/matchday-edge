name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack the signing key from secrets
        env:
          KS_B64: ${{ secrets.MDE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The MDE_KEYSTORE_B64 secret is missing, so the app would be signed with a throwaway key. Add it under Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/matchday.keystore"; echo "MDE_KEYSTORE_PATH=$RUNNER_TEMP/matchday.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          MDE_KEYSTORE_PASSWORD: ${{ secrets.MDE_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MatchdayEdge.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "Matchday Edge for Android" --notes "Download MatchdayEdge.apk on your phone and open it to install. The app loads the live site, so it updates itself."
          gh release upload app MatchdayEdge.apk --clobber
