name: Update predictions and deploy

on:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cron-job.org starts this every 2 minutes: each run settles bets, but the site is only rebuilt when the
      # published data is 13+ minutes old (GitHub Pages allows about 10 rebuilds an hour). Pushes always rebuild.
      - name: Rebuild this time, or just settle?
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          full=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # age of the last rebuild = the last push to gh-pages (the published site can lag behind it)
            last=$(gh api "repos/${{ github.repository }}/commits/gh-pages" --jq .commit.committer.date 2>/dev/null || echo "")
            if [ -n "$last" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              echo "last rebuild ${age}s ago"
              msg=$(gh api "repos/${{ github.repository }}/commits/gh-pages" --jq .commit.message 2>/dev/null || echo "")
              echo "last publish: $msg / code ${GITHUB_SHA::7}"
              if [ "$age" -lt 780 ] && echo "$msg" | grep -q "${GITHUB_SHA::7}"; then   # rebuild anyway when this code hasn't been published yet
                full=0
                curl -sf "https://snuzzyyy.github.io/matchday-edge/data.json" -o site/data.json || true
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "full rebuild: $full"
      - uses: actions/cache@v4
        if: steps.mode.outputs.full == '1'
        with:
          path: engine/cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - name: Pull fixtures, stats and odds; run the model
        if: steps.mode.outputs.full == '1'
        run: python3 engine/build.py || echo "build failed, deploying last committed data"
      - name: Settle finished bets and £1K steps (skips itself until the SUPABASE_SERVICE_KEY secret is added)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 engine/settle.py || true
      - name: Stamp the build so open apps update themselves
        if: steps.mode.outputs.full == '1'
        run: sed -i "s/name=\"mde-build\" content=\"dev\"/name=\"mde-build\" content=\"${GITHUB_SHA::7}\"/" site/index.html
      - name: Publish site to gh-pages
        if: steps.mode.outputs.full == '1'
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update $(date -u +%FT%TZ) ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
