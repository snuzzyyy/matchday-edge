plugins { id "com.android.application" }
android {
    namespace "com.snuzzyyy.matchdayedge"
    compileSdk 34
    defaultConfig {
        applicationId "com.snuzzyyy.matchdayedge"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }
    // The signing key lives in GitHub secrets (never in the repo). Without it, builds fall back to a throwaway debug key.
    def ks = System.getenv("MDE_KEYSTORE_PATH")
    signingConfigs {
        fixed {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("MDE_KEYSTORE_PASSWORD")
                keyAlias "matchday"
                keyPassword System.getenv("MDE_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { if (ks) signingConfig signingConfigs.fixed }
        release { minifyEnabled false; if (ks) signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
